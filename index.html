<!DOCTYPE html>
<html>
<head>
  <title>PAWST CLASS</title>
  <style>
    body {
      background-color: #f5f5f5;
      font-family: Arial;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #FF8C00;
      font-size: 36px;
    }
    p {
      color: #555555;
      font-size: 16px;
    }
    button {
      background-color: #FF8C00;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    h2 {
      color: #333333;
      font-size: 22px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>PAWST CLASS</h1>
  <p>Korean rescue dogs need your seat.</p>
  <p>Flying ICN to ATL? Help a dog find its forever home.</p>
  <br>
  <button>I want to help</button>
  <br><br>
  <h2>How it works</h2>
  <p>1. Register your flight from ICN to ATL</p>
  <p>2. Get matched with a rescue dog</p>
  <p>3. Pick up the dog at the airport</p>
  <p>4. Hand over to the adoption family</p>
</body>
</html>
