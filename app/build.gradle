apply plugin: 'com.android.application'

android {
    namespace 'com.pawstclass.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.pawstclass.app"
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName "1.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
}