apply plugin: 'com.android.application'

android {
    namespace 'com.pawstclass.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.pawstclass.app"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}